# Bandstand: one server, one band.
#
#   Start:    docker compose up -d
#   Logs:     docker compose logs -f
#   Stop:     docker compose down        (your data stays in the volume)
#
# Settings live in a file named ".env" next to this one. Copy ".env.example" to
# ".env" to get started. Nothing in it is required for a first band.
#
# DO NOT EDIT THIS FILE to change your setup. An update replaces it. Settings go
# in ".env". Extras such as the chart editor go in a file of your own named
# "docker-compose.override.yml", which Docker reads automatically and an update
# never touches. See docs/SELF-HOSTING.md.
#
# A SECOND BAND is a second copy of this folder with its own ".env", and that
# ".env" MUST set three things that differ from the first band:
# BANDSTAND_PROJECT, BANDSTAND_NAME and BANDSTAND_PORT.

# The project name is what ties a band to its data. It is fixed here, so that
# renaming or moving this folder does not lose the library. Two bands with the
# same project name would be treated as ONE band: give each its own.
name: ${BANDSTAND_PROJECT:-bandstand}

services:
  bandstand:
    # Uses the published version, reusing a cached copy if present. If missing,
    # Compose tries to pull it, then builds from this folder if not found.
    # The latest tag is pulled on each "up" even if cached.
    # "docker compose up -d --build" forces a source build.
    # BANDSTAND_IMAGE overrides the full image name, including the version.
    image: ${BANDSTAND_IMAGE:-ghcr.io/gloryjams/bandstand:${BANDSTAND_VERSION:-0.1.0}}
    build:
      context: .

    restart: unless-stopped

    ports:
      # host address : host port : container port
      # 0.0.0.0 lets tablets and phones on your network reach the server.
      # Behind a reverse proxy on the same machine, set BANDSTAND_BIND=127.0.0.1
      # in ".env" so that only the proxy can reach it.
      - "${BANDSTAND_BIND:-0.0.0.0}:${BANDSTAND_PORT:-7800}:7800"

    environment:
      BANDSTAND_NAME: ${BANDSTAND_NAME:-Bandstand}
      BANDSTAND_MAX_UPLOAD_MB: ${BANDSTAND_MAX_UPLOAD_MB:-50}
      BANDSTAND_LIBRARY_QUOTA_MB: ${BANDSTAND_LIBRARY_QUOTA_MB:-0}
      BANDSTAND_ROOMS: ${BANDSTAND_ROOMS:-0}
      BANDSTAND_ROOMS_MAX_OPEN: ${BANDSTAND_ROOMS_MAX_OPEN:-1}
      BANDSTAND_ROOMS_PROPOSALS_PER_MINUTE: ${BANDSTAND_ROOMS_PROPOSALS_PER_MINUTE:-5}
      BANDSTAND_ROOMS_PARTICIPATION_PER_MINUTE: ${BANDSTAND_ROOMS_PARTICIPATION_PER_MINUTE:-30}
      BANDSTAND_ROOMS_MAX_GUESTS: ${BANDSTAND_ROOMS_MAX_GUESTS:-60}
      BANDSTAND_PUBLIC_BASE: ${BANDSTAND_PUBLIC_BASE:-}
      BANDSTAND_SHARE_PAGES: ${BANDSTAND_SHARE_PAGES:-0}
      BANDSTAND_ACCESS_LOG: ${BANDSTAND_ACCESS_LOG:-0}
      BANDSTAND_EVENTS_KEY_IN_URL: ${BANDSTAND_EVENTS_KEY_IN_URL:-}
      BANDSTAND_LOG_LEVEL: ${BANDSTAND_LOG_LEVEL:-info}
      # Fixed inside the container. Change the HOST port with BANDSTAND_PORT.
      BANDSTAND_PORT: "7800"
      BANDSTAND_DATA_DIR: /data

    volumes:
      # Everything that matters is in here: charts, database, director key.
      - bandstand-data:/data

    # The server needs no privileges and writes nowhere except /data.
    read_only: true
    tmpfs:
      # Memory, so it is kept small. Uploads and exports use /data/tmp instead.
      - /tmp:size=64m,mode=1777
    # A ceiling, not a reservation. Without one, a runaway request could take
    # the whole computer down with it.
    mem_limit: ${BANDSTAND_MEMORY:-1g}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Give the server time to finish a write before it is stopped.
    stop_grace_period: 20s

  # -------------------------------------------------------------------------
  # Optional: share pages (read-only pages for people who are not in the band)
  # -------------------------------------------------------------------------
  # Off unless ".env" contains BOTH of these lines:
  #     COMPOSE_PROFILES=share
  #     BANDSTAND_SHARE_PAGES=1
  # This is the only part of Bandstand that strangers reach, so it runs as its
  # own user (1001). That user can read the library. It cannot read the
  # director key and it cannot write to the database.
  share:
    profiles: ["share"]
    image: ${BANDSTAND_IMAGE:-ghcr.io/gloryjams/bandstand:${BANDSTAND_VERSION:-0.1.0}}
    # Always the image the main server uses. Never fetched or built separately.
    pull_policy: never
    command: ["python", "-m", "server.serve_share"]
    user: "1001:1000"
    restart: unless-stopped
    depends_on:
      bandstand:
        condition: service_healthy

    ports:
      # This computer only, by default: a reverse proxy or a tunnel on the same
      # machine is what guests actually reach.
      - "${BANDSTAND_SHARE_BIND:-127.0.0.1}:${BANDSTAND_SHARE_PORT:-7810}:7810"

    environment:
      BANDSTAND_NAME: ${BANDSTAND_NAME:-Bandstand}
      BANDSTAND_SHARE_ATTRIBUTION: ${BANDSTAND_SHARE_ATTRIBUTION:-}
      BANDSTAND_BEHIND_CF: ${BANDSTAND_BEHIND_CF:-}
      BANDSTAND_LOG_LEVEL: ${BANDSTAND_LOG_LEVEL:-info}
      BANDSTAND_HOST: 0.0.0.0
      BANDSTAND_SHARE_PORT: "7810"
      BANDSTAND_DATA_DIR: /data
      BANDSTAND_HEALTH_URL: http://127.0.0.1:7810/health

    volumes:
      - bandstand-data:/data

    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: ${BANDSTAND_SHARE_MEMORY:-512m}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  bandstand-data:

# ---------------------------------------------------------------------------
# Prefer a normal folder you can see and copy, instead of a Docker volume?
# ---------------------------------------------------------------------------
# Put this in "docker-compose.override.yml". On Linux the folder must belong to
# user 1000:  mkdir bandstand-data && sudo chown 1000:1000 bandstand-data
#
#   services:
#     bandstand:
#       volumes: !override
#         - ./bandstand-data:/data
#
# ---------------------------------------------------------------------------
# Optional: a reverse proxy, for a real web address with https
# ---------------------------------------------------------------------------
# You do not need this at home on your own network. You want it when the band
# reaches the server from outside, because https also unlocks offline chart
# storage on tablets.
#
# The simplest proxy is Caddy (https://caddyserver.com). It fetches and renews
# the certificate by itself. Install it on the same machine, set
# BANDSTAND_BIND=127.0.0.1 in ".env", and use this Caddyfile:
#
#   bandstand.example.com {
#       reverse_proxy 127.0.0.1:7800
#   }
#
# With nginx or another proxy, check three things:
#   1. Response buffering is OFF for /api/events (live updates are a stream).
#      nginx: proxy_buffering off;  proxy_read_timeout 1h;
#   2. The upload size limit is at least BANDSTAND_MAX_UPLOAD_MB.
#      nginx: client_max_body_size 50m;
#   3. The proxy does not log query strings for /api/events. That address
#      carries a one-minute ticket, and, while BANDSTAND_EVENTS_KEY_IN_URL=1,
#      the key itself. A key in a log file is a leaked key.
#
# Set real limits (BANDSTAND_LIBRARY_QUOTA_MB) before you expose a server to
# the internet.
