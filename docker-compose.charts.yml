# The chart editor (SaltyCharts) is optional and lives in its own repository.
#
# To include it:
#   1. Put the SaltyCharts folder next to the Bandstand folder, named "saltycharts".
#   2. Copy THIS file to a new file named "docker-compose.override.yml".
#   3. Run: docker compose up -d --build
#
# Docker reads "docker-compose.override.yml" automatically. It is your own file:
# an update of Bandstand never replaces it.

services:
  bandstand:
    build:
      additional_contexts:
        saltycharts: ../saltycharts
      args:
        WITH_CHARTS: "1"
